{% extends 'components/Layout/base.html' %}
{% load static %}

{% block content %}
<div class="flex min-h-screen items-center justify-center px-6">
    <div class="text-center">
        <img src="{% static 'img/logo.svg' %}" class="mx-auto h-24 mb-6" alt="Logo">

        <h1 class="text-7xl font-bold text-red-500">500</h1>

        <h2 class="mt-4 text-2xl font-semibold text-gray-200">
            Error interno del servidor
        </h2>

        <p class="mt-3 text-gray-400 max-w-md">
            Ocurrió un problema inesperado. Inténtalo nuevamente más tarde.
        </p>

        <div class="mt-8">
            <a href="/"
               class="rounded-md bg-red-500 px-5 py-3 text-white font-semibold hover:bg-red-400 transition">
                Volver al inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}
